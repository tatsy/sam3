dataset:
  name: breakfast_box
  input_dir: /path/to/mvtec_loco/breakfast_box/train/good
  num_images: 100
  seed: 42

output:
  output_dir: ./outputs/breakfast_box
  format: coco_rle

inference:
  resolution: 1008
  mask_nms_threshold: 0.85

labels:
  - name: orange
    prompts:
      - orange
      - orange fruit
    confidence_threshold: 0.35
    min_area_ratio: 0.0002
    max_area_ratio: 0.40
    max_instances: 3

  - name: nectarine
    prompts:
      - nectarine
      - nectarine fruit
    confidence_threshold: 0.35
    min_area_ratio: 0.0002
    max_area_ratio: 0.40
    max_instances: 3

  - name: cereals
    prompts:
      - cereals
      - cereal flakes
    confidence_threshold: 0.30
    min_area_ratio: 0.00005
    max_area_ratio: 0.60
    max_instances: 20

  - name: banana_chips
    prompts:
      - banana chips
      - banana chip
      - dried banana slices
      - dehydrated banana slices
    confidence_threshold: 0.25
    min_area_ratio: 0.00002
    max_area_ratio: 0.20
    max_instances: 40

  - name: almonds
    prompts:
      - almonds
      - almond
    confidence_threshold: 0.30
    min_area_ratio: 0.00003
    max_area_ratio: 0.30
    max_instances: 30

  - name: white_box
    prompts:
      - white box
      - white plastic container
    confidence_threshold: 0.35
    min_area_ratio: 0.01
    max_area_ratio: 0.98
    max_instances: 1
